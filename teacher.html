<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>2학기 학부모 상담</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F2E8;
    --paper:#FFFDF8;
    --ink:#33291F;
    --ink-soft:#6E6153;
    --line:#E7DDC9;
    --mustard:#C98A3E;
    --mustard-soft:#F1DDB8;
    --sage:#6C8B6E;
    --sage-soft:#DCE7DA;
    --rose:#B5624A;
    --rose-soft:#F1DAD1;
    --wait:#B7AE9E;
    --wait-soft:#EAE5D8;
    --shadow: 0 6px 24px rgba(51,41,31,0.08);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --cream:#211C15; --paper:#2A241B; --ink:#F3EBDD; --ink-soft:#C9BEA9;
      --line:#3B3325; --mustard-soft:#4A3A1F; --sage-soft:#233428; --rose-soft:#3B2620; --wait-soft:#2E2A21;
      --shadow: 0 6px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --cream:#211C15; --paper:#2A241B; --ink:#F3EBDD; --ink-soft:#C9BEA9;
    --line:#3B3325; --mustard-soft:#4A3A1F; --sage-soft:#233428; --rose-soft:#3B2620; --wait-soft:#2E2A21;
    --shadow: 0 6px 24px rgba(0,0,0,0.35);
  }
  h1,h2,h3,.serif{font-family:'Noto Serif KR', serif;}
  h1,h2,h3{margin:0; line-height:1.3;}
  p{margin:0;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    background:none;
    color:inherit;
  }
  input, textarea, select{
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-sm);
    padding:10px 12px;
  }
  textarea{width:100%; resize:vertical; min-height:70px; line-height:1.6;}
  .app{
    max-width:960px;
    margin:0 auto;
    padding:20px 18px calc(40px + env(safe-area-inset-bottom,0px));
    min-height:100%;
  }
  .hidden{display:none !important;}

  /* ---------- role select ---------- */
  .role-screen{
    min-height:calc(100vh - 40px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:28px;
  }
  .role-emoji{font-size:52px;}
  .role-title{font-size:26px; font-weight:700;}
  .role-sub{color:var(--ink-soft); font-size:15px;}
  .role-btns{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .role-btn{
    padding:16px 26px; border-radius:var(--radius-md);
    background:var(--paper); box-shadow:var(--shadow);
    border:1px solid var(--line);
    font-size:16px; font-weight:600;
    display:flex; flex-direction:column; gap:4px; align-items:center;
    min-width:180px;
  }
  .role-btn small{font-weight:400; color:var(--ink-soft); font-size:12.5px;}
  .role-btn.teacher{border-color:var(--mustard);}
  .role-btn.parent{border-color:var(--sage);}

  /* ---------- header bars ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px; gap:10px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .logo{font-size:22px;}
  .brand .name{font-weight:700; font-size:15px;}
  .exit-link{font-size:13px; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px;}

  /* ---------- dashboard ---------- */
  .dash-header{
    background:var(--paper); border-radius:var(--radius-lg); padding:26px 24px;
    box-shadow:var(--shadow); margin-bottom:20px;
  }
  .dash-title{font-size:24px; font-weight:700; margin-bottom:6px;}
  .dash-sub{color:var(--ink-soft); font-size:14.5px; margin-bottom:16px;}
  .status-summary{
    display:flex; gap:10px; flex-wrap:wrap; font-size:13.5px;
  }
  .status-chip{
    padding:6px 12px; border-radius:999px; background:var(--wait-soft); color:var(--ink);
    display:flex; align-items:center; gap:6px;
  }
  .status-chip.progress{background:var(--mustard-soft);}
  .status-chip.done{background:var(--sage-soft);}

  .child-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:12px;
  }
  .child-card{
    background:var(--paper); border-radius:var(--radius-md); padding:16px 14px;
    box-shadow:var(--shadow); text-align:left; display:flex; flex-direction:column; gap:10px;
    border:1px solid var(--line); transition:transform .15s ease;
  }
  .child-card:hover{transform:translateY(-2px);}
  .child-avatar{
    width:44px; height:44px; border-radius:50%; background:var(--mustard-soft);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--mustard);
    font-family:'Noto Serif KR',serif; font-size:17px; overflow:hidden;
  }
  .child-avatar img{width:100%; height:100%; object-fit:cover;}
  .child-name{font-weight:600; font-size:15.5px;}
  .child-status{
    font-size:12.5px; display:flex; align-items:center; gap:5px; color:var(--ink-soft);
  }
  .dot{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .dot.wait{background:var(--wait);}
  .dot.progress{background:var(--mustard);}
  .dot.done{background:var(--sage);}

  /* ---------- child manage (teacher) ---------- */
  .manage-header{
    background:var(--paper); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px; margin-bottom:16px; flex-wrap:wrap;
  }
  .manage-header .child-avatar{width:56px; height:56px; font-size:20px;}
  .manage-title{font-size:21px; font-weight:700;}
  .manage-meta{font-size:13px; color:var(--ink-soft); margin-top:2px;}
  .btn-row{display:flex; gap:9px; flex-wrap:wrap; margin-top:14px;}
  .pill-btn{
    padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:600;
    background:var(--cream); border:1px solid var(--line);
  }
  .pill-btn.primary{background:var(--mustard); color:#fff; border-color:var(--mustard);}
  .pill-btn.ghost{background:transparent;}
  .pill-btn.danger{background:var(--rose-soft); color:var(--rose);}
  .pill-btn:disabled{opacity:.5; cursor:not-allowed;}

  .code-banner{
    background:var(--mustard-soft); border-radius:var(--radius-md); padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;
  }
  .code-num{font-family:'Noto Serif KR',serif; font-size:28px; font-weight:700; letter-spacing:4px;}
  .code-label{font-size:12.5px; color:var(--ink-soft);}

  .page-tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;
    -webkit-overflow-scrolling:touch;
  }
  .page-tab{
    flex:0 0 auto; padding:9px 13px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft); white-space:nowrap;
  }
  .page-tab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .page-panel{
    background:var(--paper); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow);
    margin-bottom:16px;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:16px; flex-wrap:wrap;
  }
  .panel-title{font-size:19px; font-weight:700;}
  .panel-actions{display:flex; gap:8px;}

  .empty-note{
    color:var(--ink-soft); font-size:14px; background:var(--cream); border-radius:var(--radius-sm);
    padding:14px 16px; border:1px dashed var(--line);
  }

  .keyword-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .keyword-chip{
    background:var(--mustard-soft); color:var(--mustard); padding:7px 13px; border-radius:999px;
    font-size:13.5px; font-weight:600;
  }
  .overview-text{font-size:16px; line-height:1.85;}

  .list-card{
    background:var(--cream); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px;
    border:1px solid var(--line);
  }
  .list-card .row-top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
  .tag-sm{font-size:12px; color:var(--sage); font-weight:600; background:var(--sage-soft); padding:3px 9px; border-radius:999px;}
  .icon-btn{font-size:13px; color:var(--ink-soft);}
  .icon-btn.del{color:var(--rose);}

  .quote-line{font-size:15.5px; font-style:normal; margin:8px 0 6px; padding-left:12px; border-left:3px solid var(--mustard); color:var(--ink);}
  .insight-line{font-size:14px; color:var(--ink-soft); line-height:1.6;}

  .chip-toggle-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip-toggle{
    padding:8px 13px; border-radius:999px; font-size:13px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  }
  .chip-toggle.on{background:var(--sage); color:#fff; border-color:var(--sage);}

  .memo-box{
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .memo-item{font-size:13.5px; color:var(--ink-soft); background:var(--rose-soft); padding:9px 12px; border-radius:var(--radius-sm); margin-bottom:6px;}
  .memo-item .memo-time{font-size:11px; opacity:.75; display:block; margin-top:3px;}

  .edit-field{margin-bottom:12px;}
  .edit-field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; font-weight:600;}
  .edit-field input, .edit-field textarea, .edit-field select{width:100%;}
  .form-actions{display:flex; gap:8px; margin-top:10px;}

  .footer-nav{
    display:flex; justify-content:space-between; align-items:center; gap:10px; position:sticky; bottom:12px;
    background:var(--paper); border-radius:999px; padding:10px 14px; box-shadow:var(--shadow); border:1px solid var(--line);
  }

  .dev-note{
    margin-top:26px; font-size:11.5px; color:var(--ink-soft); background:var(--paper); border-radius:var(--radius-sm);
    padding:12px 14px; line-height:1.6; border:1px dashed var(--line);
  }

  /* ---------- parent ---------- */
  .parent-entry{
    min-height:calc(100vh - 40px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center;
  }
  .parent-entry .role-emoji{font-size:46px;}

  .parent-session{max-width:640px; margin:0 auto;}
  .parent-header{
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .progress-dots{display:flex; gap:6px; margin-top:8px;}
  .progress-dots span{width:8px; height:8px; border-radius:50%; background:var(--line);}
  .progress-dots span.on{background:var(--mustard);}
  .parent-panel{
    background:var(--paper); border-radius:var(--radius-lg); padding:28px 26px; box-shadow:var(--shadow);
    font-size:17px; line-height:1.9;
  }
  .parent-panel .panel-title{font-size:22px; margin-bottom:18px;}
  .parent-photo{width:100%; max-height:260px; object-fit:cover; border-radius:var(--radius-md); margin-bottom:16px;}
  .waiting-sync{color:var(--ink-soft); font-size:14.5px; text-align:center; padding:30px 0;}


  /* ---------- 대본 항목별 학부모 화면 ---------- */
  .parent-preview{border:2px solid var(--sage-soft);}
  .view-label{font-size:14px; font-weight:700; color:var(--sage); margin-bottom:12px;}
  .story-card{
    background:var(--cream); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:12px;
    border:1px solid var(--line);
  }
  .story-title{font-family:'Noto Serif KR',serif; font-weight:700; font-size:16.5px; margin-bottom:6px;}
  .story-scene{font-size:15.5px; line-height:1.8;}
  .src-line{font-size:12px; color:var(--rose); margin-top:8px;}
  .keyword-chip.lg{font-size:16px; padding:10px 16px;}
  .view-image{display:block; width:100%; height:auto; border-radius:var(--radius-md); border:1px solid var(--line); background:#fff;}
  .parent-panel .story-title{font-size:19px;}
  .parent-panel .story-scene{font-size:17px; line-height:1.9;}
  .parent-panel .quote-line{font-size:17px;}
  .parent-panel .keyword-chip.lg{font-size:18px; padding:12px 18px;}
  .parent-panel .view-label{font-size:15px;}
  .page-tab{font-size:13.5px;}
  .pill-btn:disabled{opacity:.45;}

  @media (max-width:600px){
    .dash-title{font-size:20px;}
    .manage-header{flex-direction:column; align-items:flex-start;}
    .parent-panel{padding:20px 18px; font-size:16px;}
    .code-num{font-size:24px;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="parent-entry" id="lockScreen">
    <div class="role-emoji">🔒</div>
    <div class="role-title">2학기 학부모 상담 · 교사용</div>
    <div class="role-sub">비밀번호를 입력해 주세요.</div>
    <input type="password" inputmode="numeric" id="pw" style="font-size:24px; letter-spacing:6px; text-align:center; width:200px; padding:12px;" autocomplete="current-password">
    <label style="font-size:13.5px; color:var(--ink-soft); display:flex; gap:6px; align-items:center;"><input type="checkbox" id="remember" checked style="width:auto;"> 이 기기에서 비밀번호 기억하기</label>
    <button class="pill-btn primary" id="unlockBtn" style="padding:14px 28px; font-size:16px;">열기</button>
    <div id="lockMsg" style="color:var(--rose); font-size:13.5px; min-height:18px;"></div>
  </div>
</div>

const PW_KEY = 'kw_consult_teacher_pw_v1';
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(pw){
  const msg = document.getElementById('lockMsg');
  msg.style.color = 'var(--ink-soft)'; msg.textContent = '여는 중이에요…';
  try{
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(LOCKED.salt), iterations:LOCKED.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(LOCKED.iv) }, key, b64(LOCKED.data));
    const code = new TextDecoder().decode(plain);
    try{
      if(document.getElementById('remember').checked) localStorage.setItem(PW_KEY, pw);
      else localStorage.removeItem(PW_KEY);
    }catch(e){}
    document.getElementById('app').innerHTML = '';
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }catch(e){
    try{ localStorage.removeItem(PW_KEY); }catch(_){}
    msg.style.color = 'var(--rose)';
    msg.textContent = (window.crypto && crypto.subtle) ? '비밀번호가 맞지 않아요.' : '이 브라우저에서는 열 수 없어요. 사파리나 크롬으로 https 주소를 열어주세요.';
  }
}
document.getElementById('unlockBtn').addEventListener('click', ()=>unlock(document.getElementById('pw').value));
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(e.target.value); });
try{ const saved = localStorage.getItem(PW_KEY); if(saved) unlock(saved); }catch(e){}
